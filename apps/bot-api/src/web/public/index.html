<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 Discord Music Bot</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
:root {
  --accent: #7c3aed;
  --accent2: #2563eb;
  --grad: linear-gradient(135deg, #7c3aed 0%, #2563eb 100%);
  --nav-h: 56px;
}
body { font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }

/* ── Top Navbar ── */
.top-nav {
  position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
  background: var(--grad); z-index: 300;
  display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem;
  box-shadow: 0 2px 16px rgba(124,58,237,.35);
}
.nav-brand { color:#fff; font-weight:700; font-size:1.05rem; display:flex;align-items:center;gap:.5rem;text-decoration:none; }
.nav-brand .logo { width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center; }
.nav-guild { display:flex;align-items:center;gap:.5rem; }
.guild-icon { width:26px;height:26px;border-radius:50%;object-fit:cover; }
.guild-name { color:#fff;font-weight:600;font-size:.875rem; }
.nav-vc {
  display:flex;align-items:center;gap:.35rem;
  background:rgba(255,255,255,.15);border-radius:20px;padding:.2rem .65rem;
  color:#fff;font-size:.78rem;font-weight:500;
}
.nav-vc.not-connected { opacity:.55; }
.status-dot { width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0; }
.status-dot.off { background:#6c757d; }
.nav-right { margin-left:auto;display:flex;align-items:center;gap:.5rem; }

/* ── Layout ── */
.page { padding-top: calc(var(--nav-h) + 1.25rem); min-height: 100vh; }
.left-col  { display:flex;flex-direction:column;gap:1rem; }
.right-col { display:flex;flex-direction:column;gap:1rem; }

/* ── Player Card ── */
.player-card {
  background: var(--grad); border-radius: 18px; padding: 1.4rem 1.5rem;
  color:#fff; position:relative; overflow:hidden;
  box-shadow: 0 8px 32px rgba(124,58,237,.3);
}
.player-card::after {
  content:''; position:absolute; top:-50px; right:-50px;
  width:200px; height:200px; border-radius:50%;
  background:rgba(255,255,255,.05); pointer-events:none;
}
.player-card::before {
  content:''; position:absolute; bottom:-60px; left:35%;
  width:160px; height:160px; border-radius:50%;
  background:rgba(255,255,255,.035); pointer-events:none;
}
.art-box { flex-shrink:0; }
.art-img { width:80px;height:80px;border-radius:12px;object-fit:cover;box-shadow:0 4px 16px rgba(0,0,0,.4); }
.art-ph  { width:80px;height:80px;border-radius:12px;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  box-shadow:0 4px 16px rgba(0,0,0,.3); }
@keyframes spin { to { transform:rotate(360deg); } }
.spinning { animation: spin 8s linear infinite; }

.s-pill { display:inline-flex;align-items:center;gap:.3rem;
  font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:.18rem .55rem;border-radius:20px;background:rgba(255,255,255,.14); }
.s-dot  { width:6px;height:6px;border-radius:50%;display:inline-block; }

/* Equalizer */
.eq { display:flex;align-items:flex-end;gap:2px;height:16px;margin-left:4px; }
.eq-b { width:3px;border-radius:2px;background:rgba(255,255,255,.85);animation:eqb .65s ease-in-out infinite; }
.eq-b:nth-child(2){animation-delay:.11s}.eq-b:nth-child(3){animation-delay:.22s}.eq-b:nth-child(4){animation-delay:.08s}
@keyframes eqb { 0%,100%{height:3px}50%{height:14px} }

/* Progress / Seek */
.prog-wrap { position:relative; margin:1rem 0 .4rem; cursor:pointer; }
.prog-rail { height:5px;background:rgba(255,255,255,.22);border-radius:3px;position:relative; }
.prog-fill { height:100%;background:#fff;border-radius:3px;transition:width .5s linear;min-width:0;position:relative; }
.prog-fill::after { content:'';position:absolute;right:-6px;top:-4px;
  width:13px;height:13px;border-radius:50%;background:#fff;
  box-shadow:0 0 8px rgba(255,255,255,.6);opacity:0;transition:opacity .15s; }
.prog-wrap:hover .prog-fill::after { opacity:1; }

/* Control buttons */
.cb { width:42px;height:42px;border-radius:50%;border:none;
  background:rgba(255,255,255,.14);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;font-size:1rem; }
.cb:hover { background:rgba(255,255,255,.28);transform:scale(1.08);color:#fff; }
.cb.lg    { width:52px;height:52px;font-size:1.3rem;
  background:#fff;color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.3); }
.cb.lg:hover { background:rgba(255,255,255,.9);transform:scale(1.1); }
.cb.active { background:rgba(255,255,255,.3);color:#fff; }

/* Volume */
.vol-range { -webkit-appearance:none;height:4px;border-radius:2px;outline:none;cursor:pointer;background:rgba(255,255,255,.22);width:100%; }
.vol-range::-webkit-slider-thumb { -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 0 4px rgba(0,0,0,.3); }

/* ── Card ── */
.g-card { border-radius:14px;border:1px solid var(--bs-border-color); }

/* ── Queue ── */
.queue-body  { overflow-y:auto;max-height:calc(100vh - var(--nav-h) - 200px);min-height:120px; }
.qi { display:flex;align-items:center;gap:.65rem;padding:.55rem .85rem;border-radius:10px;transition:background .14s; }
.qi:hover { background:rgba(124,58,237,.07); }
[data-bs-theme="dark"] .qi:hover { background:rgba(255,255,255,.05); }
.qi.current { background:rgba(124,58,237,.12);border-left:3px solid var(--accent);padding-left:calc(.85rem - 3px); }
[data-bs-theme="dark"] .qi.current { background:rgba(124,58,237,.18); }
.qi-num { width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:var(--bs-tertiary-bg);display:flex;align-items:center;justify-content:center;
  font-size:.68rem;color:var(--bs-secondary-color); }
.qi-thumb { width:42px;height:42px;border-radius:7px;object-fit:cover;flex-shrink:0; }
.qi-ph    { width:42px;height:42px;border-radius:7px;flex-shrink:0;
  background:var(--bs-tertiary-bg);display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;color:var(--bs-secondary-color); }
.qi-title { font-size:.83rem;font-weight:600; }
.qi-sub   { font-size:.71rem;color:var(--bs-secondary-color); }

/* ── Empty state ── */
.empty { padding:2.5rem 1rem;text-align:center;color:var(--bs-secondary-color); }
.empty i { font-size:2.4rem;display:block;margin-bottom:.6rem;opacity:.35; }

/* ── Add Track input ── */
.url-input:focus { border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(124,58,237,.2)!important; }

/* ── Toast ── */
.toast-box { position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;min-width:270px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:rgba(124,58,237,.3);border-radius:2px; }

/* ── Guild Modal ── */
.guild-btn { display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;
  border-radius:10px;border:1px solid var(--bs-border-color);
  background:transparent;color:var(--bs-body-color);text-align:left;
  transition:all .15s;cursor:pointer;width:100%; }
.guild-btn:hover { background:rgba(124,58,237,.08);border-color:var(--accent); }
.guild-avatar { width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0; }
.guild-avatar-ph { width:36px;height:36px;border-radius:50%;background:var(--grad);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem;flex-shrink:0; }
</style>
</head>
<body>

<!-- ═══ Guild Modal ═══ -->
<div class="modal fade" id="guildModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered" style="max-width:400px">
    <div class="modal-content g-card">
      <div class="modal-body p-4">
        <div class="text-center mb-3">
          <div style="font-size:2.5rem;line-height:1">🎵</div>
          <h5 class="fw-bold mt-2 mb-1">Select your server</h5>
          <p class="text-muted small mb-0">Choose which Discord server to control.</p>
        </div>
        <hr class="my-3">
        <div id="guildList" class="d-flex flex-column gap-2 mb-3"></div>
        <div id="manualWrap">
          <label class="form-label small fw-semibold">Guild ID (manual)</label>
          <div class="input-group">
            <input type="text" class="form-control url-input" id="guildIdInput" placeholder="123456789012345678">
            <button class="btn btn-primary" id="connectBtn"><i class="bi bi-plug-fill"></i></button>
          </div>
          <div class="form-text">Enable Developer Mode → right-click server → Copy ID</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ Toast ═══ -->
<div class="toast-box" id="toastBox"></div>

<!-- ═══ Top Navbar ═══ -->
<nav class="top-nav">
  <a class="nav-brand" href="/">
    <span class="logo"><i class="bi bi-music-note-beamed"></i></span>
    MusicBot
  </a>

  <!-- Guild info -->
  <div class="nav-guild d-none" id="navGuild">
    <div id="navGuildIcon"></div>
    <span class="guild-name" id="navGuildName">—</span>
  </div>

  <!-- Voice channel -->
  <div class="nav-vc not-connected" id="navVc">
    <span class="status-dot off" id="vcDot"></span>
    <i class="bi bi-volume-mute-fill" id="vcIcon"></i>
    <span id="vcLabel">Not connected</span>
  </div>

  <div class="nav-right">
    <button class="btn btn-sm fw-semibold" style="background:rgba(255,255,255,.12);border:none;color:#fff" id="themeToggle">
      <i class="bi bi-sun" id="themeIcon"></i>
    </button>
    <button class="btn btn-sm fw-semibold" style="background:rgba(255,255,255,.12);border:none;color:#fff" id="changeGuildBtn" title="Switch server">
      <i class="bi bi-arrow-repeat"></i>
    </button>
  </div>
</nav>

<!-- ═══ Page ═══ -->
<div class="page container-fluid px-3 px-md-4">
  <div class="row g-3">

    <!-- ── Left column ── -->
    <div class="col-lg-5 left-col">

      <!-- Now Playing -->
      <div class="player-card">
        <div class="d-flex gap-3 align-items-start">
          <div class="art-box" id="artBox">
            <div class="art-ph"><i class="bi bi-music-note-beamed"></i></div>
          </div>
          <div class="flex-grow-1" style="min-width:0">
            <div class="d-flex align-items-center gap-1 mb-1 flex-wrap">
              <span class="s-pill" id="sPill">
                <span class="s-dot" id="sDot" style="background:#6c757d"></span>
                <span id="sText">Idle</span>
              </span>
              <div class="eq d-none" id="eqAnim">
                <div class="eq-b"></div><div class="eq-b"></div>
                <div class="eq-b"></div><div class="eq-b"></div>
              </div>
            </div>
            <h5 class="mb-0 fw-bold text-truncate" id="tTitle" style="max-width:300px">No track playing</h5>
            <div class="text-white-50 small mt-1 text-truncate" id="tArtist" style="max-width:300px">—</div>
          </div>
        </div>

        <!-- Seek / Progress -->
        <div class="prog-wrap" id="progWrap" title="Click to seek">
          <div class="prog-rail">
            <div class="prog-fill" id="progFill" style="width:0%"></div>
          </div>
        </div>
        <div class="d-flex justify-content-between mb-1" style="margin-top:-.2rem">
          <small class="text-white-50" id="tElapsed">0:00</small>
          <small class="text-white-50" id="tDuration">0:00</small>
        </div>

        <!-- Controls -->
        <div class="d-flex align-items-center justify-content-center gap-2 mt-2 flex-wrap">
          <button class="cb" id="stopBtn"    title="Stop &amp; clear"><i class="bi bi-stop-fill"></i></button>
          <button class="cb lg" id="ppBtn"   title="Play / Pause"><i class="bi bi-play-fill" id="ppIcon"></i></button>
          <button class="cb" id="skipBtn"    title="Skip"><i class="bi bi-skip-end-fill"></i></button>
          <button class="cb" id="shuffleBtn" title="Shuffle queue"><i class="bi bi-shuffle"></i></button>
          <button class="cb" id="repBtn"     title="Cycle repeat"><i class="bi bi-repeat" id="repIcon"></i></button>
        </div>

        <!-- Volume -->
        <div class="d-flex align-items-center gap-2 mt-3">
          <i class="bi bi-volume-down text-white-50"></i>
          <input type="range" class="vol-range" id="volRange" min="0" max="100" value="50">
          <i class="bi bi-volume-up text-white-50"></i>
          <small class="text-white-50 ms-1" id="volLabel" style="min-width:32px;text-align:right">50%</small>
        </div>
      </div>

      <!-- Add Track -->
      <div class="card g-card">
        <div class="card-body p-3">
          <h6 class="fw-semibold mb-2"><i class="bi bi-plus-circle text-primary"></i> Add to Queue</h6>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-youtube text-danger"></i></span>
            <input type="text" class="form-control url-input" id="urlInput"
              placeholder="YouTube URL or playlist link…" autocomplete="off">
            <button class="btn btn-primary fw-semibold" id="addBtn">
              <span id="addInner"><i class="bi bi-plus-lg"></i> Add</span>
              <span id="addSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
          </div>
          <div id="addFeedback" class="form-text mt-1"></div>
        </div>
      </div>

      <!-- Settings -->
      <div class="card g-card">
        <div class="card-body p-3">
          <div class="row g-2 align-items-center">
            <div class="col-auto">
              <span class="small fw-semibold text-muted text-uppercase" style="letter-spacing:.06em">Repeat</span>
            </div>
            <div class="col">
              <div class="btn-group btn-group-sm" id="repGroup" role="group">
                <button type="button" class="btn btn-outline-primary active" data-mode="off"><i class="bi bi-x-lg"></i> Off</button>
                <button type="button" class="btn btn-outline-primary" data-mode="track"><i class="bi bi-repeat-1"></i> Track</button>
                <button type="button" class="btn btn-outline-primary" data-mode="queue"><i class="bi bi-repeat"></i> Queue</button>
              </div>
            </div>
            <div class="col-auto d-flex align-items-center gap-2">
              <span id="connDot" style="width:9px;height:9px;border-radius:50%;background:#6c757d;display:inline-block;flex-shrink:0"></span>
              <span class="small" id="connLabel">Disconnected</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Right column: Queue ── -->
    <div class="col-lg-7 right-col">
      <div class="card g-card h-100 d-flex flex-column">
        <div class="card-header d-flex align-items-center justify-content-between py-2 px-3">
          <span class="fw-semibold">
            <i class="bi bi-collection-play"></i> Queue
            <span class="badge rounded-pill bg-primary ms-1" id="qBadge">0</span>
          </span>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" id="shuffleQueueBtn" title="Shuffle queue">
              <i class="bi bi-shuffle"></i> Shuffle
            </button>
            <button class="btn btn-sm btn-outline-danger" id="clearBtn">
              <i class="bi bi-trash3"></i> Clear
            </button>
          </div>
        </div>
        <div id="queueBody" class="queue-body flex-grow-1">
          <div class="empty">
            <i class="bi bi-collection-play"></i>
            <div class="fw-semibold">Queue is empty</div>
            <div class="small">Add a YouTube URL to get started</div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /row -->
</div><!-- /page -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script>
'use strict';
// ── State ────────────────────────────────────────────────────────────────────
let guildId   = localStorage.getItem('guildId') || null;
let guildMeta = null;   // { id, name, iconURL }
let socket    = null;
let pState    = null;
let elapsed   = 0;
let duration  = 0;
let progTimer = null;
let volTimer  = null;
let isSeeking = false;
const API = '/api';

// ── Theme ────────────────────────────────────────────────────────────────────
const html = document.documentElement;
function applyTheme(t) {
  html.setAttribute('data-bs-theme', t);
  document.getElementById('themeIcon').className = t === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
  localStorage.setItem('theme', t);
}
document.getElementById('themeToggle').addEventListener('click', () =>
  applyTheme(html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark')
);
applyTheme(localStorage.getItem('theme') || 'dark');

// ── Toast ────────────────────────────────────────────────────────────────────
const T_ICONS = { success:'bi-check-circle-fill text-success', error:'bi-x-circle-fill text-danger',
                  info:'bi-info-circle-fill text-info', warning:'bi-exclamation-triangle-fill text-warning' };
function toast(msg, type='info', ms=3500) {
  const el = document.createElement('div');
  el.className = 'toast show align-items-center border-0 mb-2 shadow-sm';
  el.setAttribute('role','alert');
  el.innerHTML = `<div class="d-flex"><div class="toast-body d-flex align-items-center gap-2">
    <i class="bi ${T_ICONS[type]||T_ICONS.info} fs-6"></i><span>${esc(msg)}</span>
  </div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
  document.getElementById('toastBox').appendChild(el);
  setTimeout(() => el.remove(), ms + 500);
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function esc(s) { const d=document.createElement('span'); d.textContent=String(s??''); return d.innerHTML; }
function fmt(s) {
  if (!s||isNaN(s)) return '0:00';
  const m=Math.floor(s/60), sec=Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
async function api(path, method='GET', body=null) {
  const opts = { method, headers:{} };
  if (body) { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  const res = await fetch(API+path, opts);
  if (!res.ok) { const j=await res.json().catch(()=>({})); throw new Error(j.error||`HTTP ${res.status}`); }
  return res.json().catch(()=>({}));
}

// ── Guild ────────────────────────────────────────────────────────────────────
const guildModal = new bootstrap.Modal(document.getElementById('guildModal'));

function applyGuild(g) {
  guildId   = g.id;
  guildMeta = g;
  localStorage.setItem('guildId', g.id);

  // Navbar guild info
  const iconEl = document.getElementById('navGuildIcon');
  if (g.iconURL) {
    iconEl.innerHTML = `<img src="${esc(g.iconURL)}" class="guild-icon" alt="">`;
  } else {
    iconEl.innerHTML = `<span style="width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff;font-weight:700">${esc(g.name[0])}</span>`;
  }
  document.getElementById('navGuildName').textContent = g.name;
  document.getElementById('navGuild').classList.remove('d-none');
  document.getElementById('connGuildId') && (document.getElementById('connGuildId').textContent = g.id);

  connectSocket();
  loadState();
}

async function initGuilds() {
  try {
    const data = await api('/guilds');
    const guilds = data.guilds || [];
    const list   = document.getElementById('guildList');

    list.innerHTML = guilds.map(g => `
      <button class="guild-btn" data-gid="${esc(g.id)}">
        ${g.iconURL
          ? `<img src="${esc(g.iconURL)}" class="guild-avatar" alt="">`
          : `<div class="guild-avatar-ph">${esc(g.name[0])}</div>`}
        <div>
          <div class="fw-semibold small">${esc(g.name)}</div>
          <div style="font-size:.7rem;opacity:.55">${g.memberCount} members</div>
        </div>
        <i class="bi bi-chevron-right ms-auto text-muted"></i>
      </button>`).join('');

    list.querySelectorAll('.guild-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const g = guilds.find(x => x.id === btn.dataset.gid);
        if (g) { applyGuild(g); guildModal.hide(); }
      });
    });

    // Auto-connect if only 1 guild, or if saved guildId is in the list
    if (guildId) {
      const saved = guilds.find(g => g.id === guildId);
      if (saved) { applyGuild(saved); return; }
    }
    if (guilds.length === 1) { applyGuild(guilds[0]); return; }

    guildModal.show();
  } catch {
    if (!guildId) guildModal.show();
    else { connectSocket(); loadState(); }
  }
}

document.getElementById('connectBtn').addEventListener('click', () => {
  const v = document.getElementById('guildIdInput').value.trim();
  if (!v) { toast('Enter a Guild ID', 'warning'); return; }
  applyGuild({ id:v, name:v.slice(-6), iconURL:null, memberCount:0 });
  guildModal.hide();
});

document.getElementById('changeGuildBtn').addEventListener('click', async () => {
  document.getElementById('guildList').innerHTML = '';
  await initGuilds().catch(() => {});
  guildModal.show();
});

// ── Socket.IO ────────────────────────────────────────────────────────────────
function connectSocket() {
  if (socket) socket.disconnect();
  socket = io({ transports:['websocket'] });
  socket.on('connect',    () => { setConn(true); socket.emit('subscribe', guildId); });
  socket.on('disconnect', () => setConn(false));
  socket.on('playerStateUpdate', state => { pState=state; renderAll(state); });
  socket.on('queueUpdate', ({ queue, currentTrack }) => renderQueue(queue, currentTrack));
  socket.on('trackStart',  track => { toast('▶ '+track.title,'info',4000); elapsed=0; startTimer(); });
  socket.on('voiceChannelUpdate', ch => setVcUI(ch?.name||null));
  socket.on('playerError', ({ message }) => toast('Error: '+message,'error',6000));
}
function setConn(ok) {
  document.getElementById('connDot').style.background = ok ? '#22c55e' : '#ef4444';
  document.getElementById('connLabel').textContent     = ok ? 'Connected' : 'Disconnected';
}

// ── Voice Channel ────────────────────────────────────────────────────────────
function setVcUI(name) {
  const vc   = document.getElementById('navVc');
  const dot  = document.getElementById('vcDot');
  const icon = document.getElementById('vcIcon');
  const lbl  = document.getElementById('vcLabel');
  if (name) {
    vc.classList.remove('not-connected');
    dot.classList.remove('off');
    icon.className = 'bi bi-volume-up-fill';
    lbl.textContent = name;
  } else {
    vc.classList.add('not-connected');
    dot.classList.add('off');
    icon.className = 'bi bi-volume-mute-fill';
    lbl.textContent = 'Not connected';
  }
}

// ── Progress timer ────────────────────────────────────────────────────────────
function startTimer() {
  stopTimer();
  progTimer = setInterval(() => {
    if (isSeeking) return;
    elapsed++;
    document.getElementById('tElapsed').textContent = fmt(elapsed);
    if (duration > 0) {
      document.getElementById('progFill').style.width = Math.min(elapsed/duration*100, 100)+'%';
    }
  }, 1000);
}
function stopTimer() { if (progTimer) { clearInterval(progTimer); progTimer=null; } }
function resetProg() {
  stopTimer(); elapsed=0;
  document.getElementById('progFill').style.width='0%';
  document.getElementById('tElapsed').textContent='0:00';
  document.getElementById('tDuration').textContent='0:00';
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll(state) {
  const { currentTrack:t, isPlaying, isPaused, repeatMode, volume, voiceChannelName, position } = state;
  const playing = isPlaying && !isPaused;

  // Status pill
  const dot=document.getElementById('sDot'), txt=document.getElementById('sText'), eq=document.getElementById('eqAnim');
  if (playing)       { dot.style.background='#22c55e'; txt.textContent='Playing'; eq.classList.remove('d-none'); }
  else if (isPaused) { dot.style.background='#f59e0b'; txt.textContent='Paused';  eq.classList.add('d-none'); }
  else               { dot.style.background='#6c757d'; txt.textContent='Idle';    eq.classList.add('d-none'); }

  // Art
  const box=document.getElementById('artBox');
  if (t?.thumbnailUrl) {
    box.innerHTML=`<img class="art-img${playing?' spinning':''}" src="${esc(t.thumbnailUrl)}" alt="art"
      onerror="this.outerHTML='<div class=\\'art-ph\\'><i class=\\'bi bi-music-note-beamed\\'></i></div>'">`;
  } else {
    box.innerHTML=`<div class="art-ph"><i class="bi bi-music-note-beamed"></i></div>`;
  }

  // Track info
  document.getElementById('tTitle').textContent  = t ? t.title           : 'No track playing';
  document.getElementById('tArtist').textContent = t ? (t.uploader||'—') : '—';

  // Duration + sync elapsed from server position
  duration = t?.durationSec || 0;
  document.getElementById('tDuration').textContent = fmt(duration);
  if (t && !isSeeking) {
    elapsed = position || 0;
    document.getElementById('tElapsed').textContent = fmt(elapsed);
    if (duration > 0) document.getElementById('progFill').style.width = Math.min(elapsed/duration*100,100)+'%';
  }

  // Timer
  if (playing && !progTimer) startTimer();
  if (!playing) stopTimer();
  if (!t) resetProg();

  // Play/pause icon
  document.getElementById('ppIcon').className = playing ? 'bi bi-pause-fill' : 'bi bi-play-fill';

  // Volume
  if (volume !== undefined) {
    const pct = Math.round(volume*100);
    document.getElementById('volRange').value = pct;
    document.getElementById('volLabel').textContent = pct+'%';
  }

  // Repeat
  setRepeatUI(repeatMode||'off');

  // Voice channel
  setVcUI(voiceChannelName||null);

  // Queue
  renderQueue(state.queue, t);
}

function renderQueue(queue, currentTrack) {
  const body = document.getElementById('queueBody');
  document.getElementById('qBadge').textContent = queue.length;

  if (!queue.length && !currentTrack) {
    body.innerHTML=`<div class="empty"><i class="bi bi-collection-play"></i>
      <div class="fw-semibold">Queue is empty</div>
      <div class="small">Add a YouTube URL to get started</div></div>`;
    return;
  }

  // Build rows: current track first (highlighted), then queue
  let html = '';

  if (currentTrack) {
    const dur = currentTrack.durationSec ? fmt(currentTrack.durationSec) : '';
    const thumb = currentTrack.thumbnailUrl
      ? `<img class="qi-thumb" src="${esc(currentTrack.thumbnailUrl)}" loading="lazy" onerror="this.style.display='none'" alt="">`
      : `<div class="qi-ph"><i class="bi bi-music-note"></i></div>`;
    html += `<div class="qi current">
      <div class="qi-num" style="color:var(--accent)"><i class="bi bi-play-fill" style="font-size:.7rem"></i></div>
      ${thumb}
      <div class="flex-grow-1" style="min-width:0">
        <div class="qi-title text-truncate" title="${esc(currentTrack.title)}">${esc(currentTrack.title)}</div>
        <div class="qi-sub">${esc(currentTrack.uploader||'—')}${dur?' · '+dur:''} · <span style="color:var(--accent)">Now Playing</span></div>
      </div>
    </div>`;
  }

  html += queue.map((tk, i) => {
    const dur = tk.durationSec ? fmt(tk.durationSec) : '';
    const thumb = tk.thumbnailUrl
      ? `<img class="qi-thumb" src="${esc(tk.thumbnailUrl)}" loading="lazy" onerror="this.style.display='none'" alt="">`
      : `<div class="qi-ph"><i class="bi bi-music-note"></i></div>`;
    return `<div class="qi">
      <div class="qi-num">${i+1}</div>
      ${thumb}
      <div class="flex-grow-1" style="min-width:0">
        <div class="qi-title text-truncate" title="${esc(tk.title)}">${esc(tk.title)}</div>
        <div class="qi-sub">${esc(tk.uploader||'—')}${dur?' · '+dur:''}</div>
      </div>
      <button class="btn btn-link btn-sm text-danger p-1 rm-btn" data-i="${i}" title="Remove">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>`;
  }).join('');

  body.innerHTML = html;
  body.querySelectorAll('.rm-btn').forEach(b =>
    b.addEventListener('click', () => removeTrack(+b.dataset.i))
  );
}

// ── Repeat UI ─────────────────────────────────────────────────────────────────
function setRepeatUI(mode) {
  document.querySelectorAll('#repGroup [data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode===mode)
  );
  const icon=document.getElementById('repIcon'), btn=document.getElementById('repBtn');
  icon.className = mode==='track' ? 'bi bi-repeat-1' : 'bi bi-repeat';
  btn.classList.toggle('active', mode!=='off');
}

// ── Load state ────────────────────────────────────────────────────────────────
async function loadState() {
  if (!guildId) return;
  try {
    const d = await api(`/guilds/${guildId}/queue`);
    renderAll({
      currentTrack:    d.currentTrack,
      queue:           d.queue||[],
      isPlaying:       d.isPlaying||false,
      isPaused:        d.isPaused||false,
      repeatMode:      d.repeatMode||'off',
      position:        d.position||0,
      volume:          d.volume??0.5,
      voiceChannelId:  d.voiceChannelId||null,
      voiceChannelName:d.voiceChannelName||null,
    });
  } catch {}
}

async function removeTrack(idx) {
  if (!guildId) return;
  try { await api(`/guilds/${guildId}/queue/${idx+1}`,'DELETE'); toast('Removed','info'); loadState(); }
  catch (e) { toast(e.message,'error'); }
}

// ── Seek bar ──────────────────────────────────────────────────────────────────
document.getElementById('progWrap').addEventListener('click', async (e) => {
  if (!guildId || !pState?.currentTrack || !duration) return;
  const rail = e.currentTarget;
  const rect  = rail.getBoundingClientRect();
  const pct   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const secs  = Math.floor(pct * duration);
  isSeeking = true;
  elapsed = secs;
  document.getElementById('progFill').style.width = (pct*100)+'%';
  document.getElementById('tElapsed').textContent = fmt(secs);
  try {
    await api(`/guilds/${guildId}/seek`,'POST',{ position: secs });
    startTimer();
  } catch (e) { toast('Seek failed: '+e.message,'error'); }
  finally { setTimeout(() => { isSeeking=false; }, 500); }
});

// ── Add Track ─────────────────────────────────────────────────────────────────
async function addTrack() {
  if (!guildId) { guildModal.show(); return; }
  const inp=document.getElementById('urlInput'), url=inp.value.trim();
  if (!url) { toast('Paste a YouTube URL first','warning'); return; }
  const inner=document.getElementById('addInner'), spinner=document.getElementById('addSpinner');
  const fb=document.getElementById('addFeedback');
  inner.classList.add('d-none'); spinner.classList.remove('d-none'); fb.textContent='';
  try {
    const d = await api(`/guilds/${guildId}/play`,'POST',{ url });
    inp.value='';
    toast('Added: '+(d.track?.title||'Track'),'success');
    loadState();
  } catch (e) {
    fb.innerHTML=`<span class="text-danger"><i class="bi bi-exclamation-circle"></i> ${esc(e.message)}</span>`;
    toast(e.message,'error');
  } finally { inner.classList.remove('d-none'); spinner.classList.add('d-none'); }
}
document.getElementById('addBtn').addEventListener('click', addTrack);
document.getElementById('urlInput').addEventListener('keydown', e => { if(e.key==='Enter') addTrack(); });

// ── Player Controls ───────────────────────────────────────────────────────────
document.getElementById('ppBtn').addEventListener('click', async () => {
  if (!guildId) return;
  try {
    const playing = pState?.isPlaying && !pState?.isPaused;
    await api(`/guilds/${guildId}/${playing?'pause':'resume'}`,'POST');
    if (playing) stopTimer(); else startTimer();
  } catch (e) { toast(e.message,'error'); }
});
document.getElementById('skipBtn').addEventListener('click', async () => {
  if (!guildId) return;
  try { await api(`/guilds/${guildId}/skip`,'POST'); elapsed=0; toast('Skipped ⏭','info'); }
  catch (e) { toast(e.message,'error'); }
});
document.getElementById('stopBtn').addEventListener('click', async () => {
  if (!guildId) return;
  try { await api(`/guilds/${guildId}/stop`,'POST'); resetProg(); toast('Stopped ⏹','info'); loadState(); }
  catch (e) { toast(e.message,'error'); }
});
document.getElementById('clearBtn').addEventListener('click', async () => {
  if (!guildId) return;
  if (!confirm('Clear the entire queue?')) return;
  try { await api(`/guilds/${guildId}/queue`,'DELETE'); toast('Queue cleared','info'); loadState(); }
  catch (e) { toast(e.message,'error'); }
});

// ── Shuffle ───────────────────────────────────────────────────────────────────
async function doShuffle() {
  if (!guildId) return;
  try { await api(`/guilds/${guildId}/shuffle`,'POST'); toast('🔀 Queue shuffled','info'); loadState(); }
  catch (e) { toast(e.message,'error'); }
}
document.getElementById('shuffleBtn').addEventListener('click', doShuffle);
document.getElementById('shuffleQueueBtn').addEventListener('click', doShuffle);

// ── Volume ────────────────────────────────────────────────────────────────────
document.getElementById('volRange').addEventListener('input', e => {
  document.getElementById('volLabel').textContent = e.target.value+'%';
  clearTimeout(volTimer);
  volTimer = setTimeout(async () => {
    if (!guildId) return;
    try { await api(`/guilds/${guildId}/volume`,'POST',{ volume:+e.target.value }); }
    catch {}
  }, 300);
});

// ── Repeat ────────────────────────────────────────────────────────────────────
document.getElementById('repBtn').addEventListener('click', async () => {
  if (!guildId) return;
  const modes=['off','track','queue'], cur=pState?.repeatMode||'off';
  const next = modes[(modes.indexOf(cur)+1)%modes.length];
  try { await api(`/guilds/${guildId}/repeat`,'POST',{mode:next}); setRepeatUI(next); if(pState) pState.repeatMode=next; }
  catch (e) { toast(e.message,'error'); }
});
document.getElementById('repGroup').addEventListener('click', async e => {
  const btn=e.target.closest('[data-mode]');
  if (!btn||!guildId) return;
  const mode=btn.dataset.mode;
  try { await api(`/guilds/${guildId}/repeat`,'POST',{mode}); setRepeatUI(mode); if(pState) pState.repeatMode=mode; }
  catch (e) { toast(e.message,'error'); }
});

// ── Init ──────────────────────────────────────────────────────────────────────
initGuilds();
setInterval(() => { if (guildId) loadState(); }, 15000);
</script>
</body>
</html>
