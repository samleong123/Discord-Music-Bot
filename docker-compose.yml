services:
  musicbot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: musicbot-all-in-one
    environment:
      # PostgreSQL
      POSTGRES_USER: musicbot
      POSTGRES_PASSWORD: musicbot_secure_password
      POSTGRES_DB: musicbot_db
      DATABASE_URL: postgresql://musicbot:musicbot_secure_password@localhost:5432/musicbot_db

      # Redis
      REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

      # Web Server
      NODE_ENV: production
      PORT: "3000"
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID_DEV: ${DISCORD_GUILD_ID_DEV}
      DASHBOARD_BASE_URL: ${DASHBOARD_BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      OWNER_DISCORD_IDS: ${OWNER_DISCORD_IDS}
      DEFAULT_VOLUME: ${DEFAULT_VOLUME:-0.5}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-100}
      IDLE_DISCONNECT_SECONDS: ${IDLE_DISCONNECT_SECONDS:-300}

    ports:
      - "3000:3000"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - redis_data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
